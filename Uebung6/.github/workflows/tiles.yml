name: Vector Tiles erzeugen

on:
  push:
    paths:
      - "data/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tippecanoe-Image bauen
        run: docker build -t tippecanoe-uebung6 tools

      - name: PMTiles erzeugen
        run: |
          mkdir -p tiles
          docker run --rm -v "$PWD":/work tippecanoe-uebung6 \
            tippecanoe -o tiles/population.pmtiles -l population \
            -Z8 -z15 --no-tile-size-limit --coalesce-densest-as-needed --force \
            data/population.geojson

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tiles/population.pmtiles
          git diff --cached --quiet || (git commit -m "PMTiles aktualisiert" && git push)

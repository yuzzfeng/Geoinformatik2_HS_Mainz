<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <title>Flask + PostGIS Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    body{font-family:system-ui,Arial;padding:24px}
    pre{background:#f7f7f7;padding:12px;border-radius:8px}
    #map{height:480px;border-radius:8px;box-shadow:0 2px 8px #0001;margin-top:16px}
    .hint{color:#666;font-size:12px}
  </style>
</head>
<body>
  <h1>✅ Service is running</h1>
  <p>If the table below shows data from the database, the connection is OK:</p>
  <div id="out">Loading...</div>

  <h2 style="margin-top:28px">🗺️ GeoServer WMS + WFS Vorschau</h2>
  <p class="hint">Raster-Daten (wie mainz.tif) über WMS; Vektor-Daten (PostGIS: points, places) über WFS.</p>
  <p id="map-status" role="status">Layer werden geladen …</p>
  <div id="map"></div>

  <script>
    fetch('/api/places')
      .then(r => r.json())
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) {
          document.getElementById('out').textContent = 'No data.';
          return;
        }
        // Build table
        let html = '<table border="1" cellpadding="6" style="border-collapse:collapse;border-radius:8px;box-shadow:0 2px 8px #0001;background:#fff;">';
        html += '<thead><tr>';
        for (const key of Object.keys(data[0])) html += `<th>${key}</th>`;
        html += '</tr></thead><tbody>';
        for (const row of data) {
          html += '<tr>';
          for (const key of Object.keys(data[0])) html += `<td>${row[key]}</td>`;
          html += '</tr>';
        }
        html += '</tbody></table>';
        document.getElementById('out').innerHTML = html;
      })
      .catch(e => {
        document.getElementById('out').textContent = 'Failed to fetch /api/places: ' + e;
      });
  </script>
  
  <!-- Leaflet + WMS/WFS Beispiel -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Grundkarte (OSM)
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    const map = L.map('map', {
      center: [50.0, 8.27],  // Raum Mainz
      zoom: 10,
      layers: [osm]
    });

  // GeoServer WMS Layer (Workspace: uebung)
    const WMS_URL = 'http://localhost:8080/geoserver/uebung/wms';

  // Layer-Steuerung (Initialize, then automatically add all discovered layers)
    const layersControl = L.control.layers(
      { 'OpenStreetMap': osm },
      {}
    ).addTo(map);

    const status = document.getElementById('map-status');
    const fullName = name => name.includes(':') ? name : `uebung:${name}`;

    async function capabilities(url) {
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const response = await fetch(url, {cache: 'no-store'});
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const xml = new DOMParser().parseFromString(await response.text(), 'application/xml');
          if (xml.querySelector('parsererror, ServiceException, ExceptionText')) {
            throw new Error('Ungültige Capabilities-Antwort');
          }
          return xml;
        } catch (error) {
          if (attempt === 3) throw error;
          await new Promise(resolve => setTimeout(resolve, 2000));
        }
      }
    }

    async function loadLayers() {
      const errors = [];
      try {
        const xml = await capabilities(WMS_URL + '?service=WMS&version=1.3.0&request=GetCapabilities');
        const names = [...new Set(Array.from(xml.querySelectorAll('Layer > Name'),
          node => node.textContent.trim()).filter(name => name && name !== 'uebung').map(fullName))];
        if (!names.includes('uebung:mainz')) throw new Error('Mainz wurde noch nicht veröffentlicht');
        names.sort().forEach(name => {
          const layer = L.tileLayer.wms(WMS_URL, {layers: name, format: 'image/png', transparent: true});
          layer.on('tileerror', () => {
            status.textContent = `WMS-Bild für ${name} konnte nicht geladen werden. GeoServer-Logs prüfen.`;
          });
          if (name === 'uebung:mainz') layer.addTo(map);
          layersControl.addOverlay(layer, `WMS - ${name}`);
        });
      } catch (error) {
        errors.push(`WMS: ${error.message}`);
      }

      // WFS-Capabilities contain only vector layers; do not request rasters as WFS.
      try {
        const wfsUrl = 'http://localhost:8080/geoserver/uebung/ows';
        const xml = await capabilities(wfsUrl + '?service=WFS&version=2.0.0&request=GetCapabilities');
        const names = [...new Set(Array.from(xml.getElementsByTagNameNS('*', 'FeatureType'), type =>
          type.getElementsByTagNameNS('*', 'Name')[0]?.textContent.trim()).filter(Boolean).map(fullName))];
        await Promise.all(names.map(async name => {
          try {
            const query = new URLSearchParams({service: 'WFS', version: '2.0.0', request: 'GetFeature',
              typeNames: name, outputFormat: 'application/json', srsName: 'EPSG:4326'});
            const response = await fetch(`${wfsUrl}?${query}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!Array.isArray(data.features)) throw new Error('Keine FeatureCollection');
            const layer = L.geoJSON(data, {
              pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
                radius: 6, color: '#d33', weight: 2, fillColor: '#f88', fillOpacity: 0.7
              }),
              onEachFeature: (feature, featureLayer) => {
                const popup = document.createElement('div');
                Object.entries(feature.properties || {}).forEach(([key, value]) => {
                  const row = document.createElement('div');
                  row.textContent = `${key}: ${value}`;
                  popup.appendChild(row);
                });
                featureLayer.bindPopup(popup);
              }
            });
            // Keep the initial view on Mainz, regardless of request completion order.
            if (name === 'uebung:points') layer.addTo(map);
            layersControl.addOverlay(layer, `WFS - ${name}`);
          } catch (error) {
            errors.push(`${name}: ${error.message}`);
          }
        }));
      } catch (error) {
        errors.push(`WFS: ${error.message}`);
      }
      if (errors.length) status.textContent = `Nicht alle Layer geladen: ${errors.join('; ')}. Nach der Veröffentlichung die Seite neu laden.`;
      else if (status.textContent === 'Layer werden geladen …') status.textContent = 'Mainz und points sind aktiviert. Weitere Layer können Sie im Kartenmenü einschalten.';
    }
    loadLayers();

  </script>
</body>
</html>
